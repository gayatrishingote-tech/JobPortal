<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | JobPortal</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .forgot-page {

            min-height: calc(100vh - 72px);

            padding: 60px 7%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f7f7fc;

            box-sizing: border-box;

        }


        .forgot-card {

            width: 100%;

            max-width: 460px;

            padding: 45px;

            background: white;

            border: 1px solid #e6e6f0;

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(49, 46, 129, 0.14);

            box-sizing: border-box;

        }


        .forgot-icon {

            width: 60px;

            height: 60px;

            margin-bottom: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #f5f3ff,
                #ede9fe
            );

            border: 1px solid #ddd6fe;

            color: #6366f1;

            font-size: 25px;

        }


        .forgot-label {

            display: block;

            margin-bottom: 8px;

            color: #6366f1;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;

        }


        .forgot-card h1 {

            margin: 0 0 10px;

            color: #172033;

            font-size: 30px;

        }


        .forgot-card > p {

            margin: 0 0 28px;

            color: #667085;

            font-size: 12px;

            line-height: 1.6;

        }


        .forgot-form-group {

            margin-bottom: 20px;

        }


        .forgot-form-group label {

            display: block;

            margin-bottom: 8px;

            color: #344054;

            font-size: 12px;

            font-weight: 700;

        }


        .forgot-input {

            width: 100%;

            height: 50px;

            padding: 0 14px;

            border: 1px solid #d9d9e5;

            border-radius: 10px;

            outline: none;

            box-sizing: border-box;

            color: #172033;

            font-size: 13px;

        }


        .forgot-input:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99,102,241,0.09);

        }


        .forgot-button {

            width: 100%;

            height: 51px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #4f46e5
            );

            color: white;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 24px rgba(99,102,241,0.23);

        }


        .forgot-button:hover {

            transform: translateY(-2px);

        }


        .forgot-message {

            min-height: 20px;

            margin: 15px 0;

            text-align: center;

            font-size: 11px;

        }


        .back-login {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #6366f1;

            font-size: 11px;

            font-weight: 700;

            text-decoration: none;

        }


        .back-login:hover {

            color: #4f46e5;

        }


        @media (max-width: 600px) {

            .forgot-page {

                padding: 30px 5%;

            }

            .forgot-card {

                padding: 30px 22px;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">

            Job<span>Portal</span>

        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="jobs.html">
                Jobs
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="admin.html">
                Admin
            </a>

        </div>

    </nav>


    <!-- FORGOT PASSWORD -->

    <main class="forgot-page">

        <div class="forgot-card">


            <div class="forgot-icon">

                🔐

            </div>


            <span class="forgot-label">

                ACCOUNT RECOVERY

            </span>


            <h1>

                Forgot Password?

            </h1>


            <p>

                Enter your registered email address
                and create a new password for your
                JobPortal account.

            </p>


            <form id="forgotPasswordForm">


                <div class="forgot-form-group">

                    <label for="forgotEmail">

                        Email Address

                    </label>


                    <input

                        type="email"

                        id="forgotEmail"

                        class="forgot-input"

                        placeholder="Enter your registered email"

                        required

                    >

                </div>


                <div class="forgot-form-group">

                    <label for="newPassword">

                        New Password

                    </label>


                    <input

                        type="password"

                        id="newPassword"

                        class="forgot-input"

                        placeholder="Enter your new password"

                        minlength="6"

                        required

                    >

                </div>


                <div class="forgot-form-group">

                    <label for="confirmPassword">

                        Confirm New Password

                    </label>


                    <input

                        type="password"

                        id="confirmPassword"

                        class="forgot-input"

                        placeholder="Confirm your new password"

                        minlength="6"

                        required

                    >

                </div>


                <button

                    type="submit"

                    class="forgot-button"

                >

                    Reset Password

                </button>


            </form>


            <p

                id="forgotPasswordMessage"

                class="forgot-message"

            ></p>


            <a

                href="login.html"

                class="back-login"

            >

                ← Back to Login

            </a>


        </div>

    </main>


    <!-- FOOTER -->

    <footer class="simple-footer">

        <div class="simple-footer-inner">

            <div class="footer-logo">

                Job<span>Portal</span>

            </div>


            <p>

                © 2026 JobPortal. All rights reserved.

            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
